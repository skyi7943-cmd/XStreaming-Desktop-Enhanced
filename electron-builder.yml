appId: com.Geocld.xstreaming
productName: XStreaming
copyright: Copyright © 2024 Geocld
npmRebuild: false
afterPack: ./scripts/afterPackSteamOS.js

asarUnpack:
  - "**/node_modules/peasyo-sdl-lib/**/*"
  - "**/node_modules/node-hid/**/*"

directories:
  output: dist
  buildResources: resources

files:
  - from: .
    filter:
      - package.json
      - app

publish:
- github


# Mac OS configuration
mac:
  category: public.app-category.games
  # icon: "src/app/assets/images/icon.icns"
  target: 
  - target: dmg
    arch: 
    - universal

# Config for OSX dmg
dmg:
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: "link"
      path: "/Applications"

# Windows configuration
win:
  signAndEditExecutable: false
  extraResources:
    - from: native/bin
      to: native
      filter:
        - "**/*"
  target:
    - "zip"
    - "nsis"

# Config for the windows installer
nsis:
  oneClick: true
  perMachine: true

# Linux / SteamOS (Steam Deck) configuration
linux:
  category: Game
  executableName: xstreaming
  artifactName: "XStreaming-SteamDeck-SteamOS-${arch}.${ext}"
  target:
    - "AppImage"