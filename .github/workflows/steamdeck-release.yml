name: Build & Deploy Dedicated SteamOS (Steam Deck) Release

on:
  workflow_dispatch:
    inputs:
      steamos_tag:
        description: "Dedicated GitHub Release Tag for Steam Deck (SteamOS)"
        required: false
        default: "v1.10.3-steamos"

permissions:
  contents: write

jobs:
  build-steamos:
    name: Build SteamOS x86_64 AppImage & One-Click Bundle
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install system libs for AppImage packaging
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2 file

      - name: Install Yarn dependencies
        run: yarn install --network-timeout 120000

      - name: Normalize Unix LF line endings on SteamOS scripts
        run: |
          sed -i 's/\r$//' scripts/install-steamos.sh
          chmod +x scripts/install-steamos.sh

      - name: Build Next.js + Electron Main + SteamOS AppImage
        run: |
          npx next build renderer
          npx next export -o app renderer
          node node_modules/nextron/bin/webpack.config.js
          npx electron-builder --linux AppImage --x64 --publish never
          ls -lh dist/

      - name: Smoke-test SteamOS AppImage wrapper, RDNA2 VA-API env & unpacked SDL2/HID addons
        run: |
          chmod +x dist/XStreaming-SteamDeck-SteamOS-x86_64.AppImage
          ./dist/XStreaming-SteamDeck-SteamOS-x86_64.AppImage --appimage-extract >/dev/null
          head -n 12 squashfs-root/xstreaming
          grep -q "LIBVA_DRIVER_NAME" squashfs-root/xstreaming
          grep -q -- "--no-sandbox" squashfs-root/xstreaming
          test -x squashfs-root/xstreaming.bin
          test -d squashfs-root/resources/app.asar.unpacked/node_modules/peasyo-sdl-lib
          test -d squashfs-root/resources/app.asar.unpacked/node_modules/node-hid
          rm -rf squashfs-root
          echo "✅ SteamOS AppImage 内部结构、防沙盒崩溃包装器与原生手柄动态库校验全部通过！"

      - name: Package SteamOS One-Click Installer Bundle (.tar.gz)
        run: |
          BUNDLE_DIR="dist/XStreaming-SteamDeck-SteamOS"
          mkdir -p "$BUNDLE_DIR"
          cp dist/XStreaming-SteamDeck-SteamOS-x86_64.AppImage "$BUNDLE_DIR/"
          cp scripts/install-steamos.sh "$BUNDLE_DIR/install-steamos.sh"
          chmod +x "$BUNDLE_DIR/install-steamos.sh" "$BUNDLE_DIR/XStreaming-SteamDeck-SteamOS-x86_64.AppImage"
          if [ -f resources/icon.png ]; then
            cp resources/icon.png "$BUNDLE_DIR/icon.png"
          elif [ -f flatpak/io.github.Geocld.XStreamingDesktop.png ]; then
            cp flatpak/io.github.Geocld.XStreamingDesktop.png "$BUNDLE_DIR/icon.png"
          fi
          cat > "$BUNDLE_DIR/Install-on-SteamDeck.desktop" <<'EOF'
          [Desktop Entry]
          Name=一键安装 XStreaming 到 Steam Deck 游戏库
          Comment=自动安装并添加到 SteamOS 掌机模式游戏库
          Exec=sh -c 'cd "$(dirname "$1")" && ./install-steamos.sh; echo ""; echo "按回车键关闭窗口..."; read _' dummy %k
          Icon=system-software-install
          Terminal=true
          Type=Application
          EOF
          sed -i 's/^          //' "$BUNDLE_DIR/Install-on-SteamDeck.desktop"
          chmod +x "$BUNDLE_DIR/Install-on-SteamDeck.desktop"
          tar -C dist -czf dist/XStreaming-SteamDeck-SteamOS-OneClick-Installer.tar.gz XStreaming-SteamDeck-SteamOS
          ls -lh dist/XStreaming-SteamDeck-SteamOS-OneClick-Installer.tar.gz

      - name: Publish to Dedicated SteamOS GitHub Release (Separated from Windows)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.steamos_tag || 'v1.10.3-steamos' }}"
          NOTES_FILE="dist/steamos-notes.md"
          cat > "$NOTES_FILE" <<'EOF'
          ## 🎮 Steam Deck (SteamOS 3.x) 独立专属原生发布版
          > 本发布页专为 **Valve Steam Deck LCD (60Hz) / Steam Deck OLED (90Hz)** 原生 **SteamOS 3.x** 系统独立打包（与 Windows PC 版本完全分离，体积轻量、零 Windows 冗余组件）。

          ### ⬇️ 两种安装方式任选其一

          #### 方式一：全自动一键导入 Steam 掌机库（强烈推荐新手！）
          1. 在 Steam Deck 切换至 **桌面模式 (Desktop Mode)**，下载下方 **`XStreaming-SteamDeck-SteamOS-OneClick-Installer.tar.gz`** 并右键解压；
          2. 打开解压后的文件夹，双击运行 **`一键安装 XStreaming 到 Steam Deck 游戏库` (`Install-on-SteamDeck.desktop`)**（或在文件夹空白处右键 `Open Terminal Here` 输入 `./install-steamos.sh` 回车）；
          3. 脚本会自动将程序安装至 `~/Applications/XStreaming-Enhanced`、赋予执行权限，并**自动写入你的 Steam 非 Steam 游戏库 (`shortcuts.vdf`)**！直接返回 **掌机游戏模式 (Gaming Mode)** 即可在「非 Steam 游戏」里一键全屏开玩！

          #### 方式二：单文件纯净免安装版 (`.AppImage`)
          1. 下载下方 **`XStreaming-SteamDeck-SteamOS-x86_64.AppImage`**；
          2. 右键文件 → `Properties (属性)` → `Permissions (权限)` → 勾选 `Is executable (允许作为程序执行)`；
          3. 右键选择 `Add to Steam (添加到 Steam)`，返回 **掌机游戏模式** 启动即可！

          ---

          ### 🛠️ 针对 SteamOS 3.x 的深度底层适配清单
          - **零崩溃内核级启动封装**：内置 `xstreaming` 底层启动器，在 Chromium Zygote 初始化前自动注入 `--no-sandbox`、`--disable-dev-shm-usage` 与 `ELECTRON_DISABLE_SANDBOX=1`，彻底杜绝 AppImage 在 SteamOS `Gamescope` / `SteamLinuxRuntime` 容器中启动闪退；
          - **RDNA2 硬件 `VA-API` 解码 + `WebGL2` 零拷贝光影补帧双管齐下**：默认绑定 `LIBVA_DRIVER_NAME=radeonsi` 启用 Van Gogh / Sephiroth APU 硬件解码，配合内置 `RDNA2 WebGL2` 增强管线，在 SteamOS 下原生支持 **`30-in-60` 重复帧剥离 + 真 30→60 光流补帧 + 自然均衡/鲜明通透/电影光影（支持双层串联）+ AMD CAS/RCAS 去噪锐化**；
          - **`Gamescope` 掌机窗口与微软登录弹窗专项适配**：在掌机模式下自动锁定 `1280×800` 全屏无偏移触控，且微软 Xbox 登录窗口自动全屏模态前置，绝不卡在后台；
          - **掌机免键盘手柄组合键**：串流中按住左上方视图键 **`⧉ (View)`** + **`R3`**（调出增强中心）、**`⧉ + Y`**（原画对比）、**`⧉ + L3`**（真实延迟监控）、**`⧉ + X`**（60FPS 原声内录），首次启动自动加载 **「🎮 Steam Deck 800P 黄金预设」**！
          EOF
          sed -i 's/^          //' "$NOTES_FILE"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --title "🎮 [Steam Deck / SteamOS 专属版] XStreaming Enhanced v1.10.3 (原生 RDNA2 光影精雕 + 真 X2 补帧)" \
              --notes-file "$NOTES_FILE"
          else
            gh release create "$TAG" \
              --target main \
              --title "🎮 [Steam Deck / SteamOS 专属版] XStreaming Enhanced v1.10.3 (原生 RDNA2 光影精雕 + 真 X2 补帧)" \
              --notes-file "$NOTES_FILE"
          fi

          gh release upload "$TAG" \
            dist/XStreaming-SteamDeck-SteamOS-x86_64.AppImage \
            dist/XStreaming-SteamDeck-SteamOS-OneClick-Installer.tar.gz \
            --clobber
